<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 756" role="img" aria-labelledby="title desc">
  <title id="title">Balances de materia y energía en la pasteurización HTST</title>
  <desc id="desc">Diagrama de bloques de la corriente principal y el retorno alternativo. Balance de energía del intercambiador de placas con ambas corrientes separadas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:Arial,sans-serif;fill:#172d38;font-size:17px}
    .title{font-size:26px;font-weight:bold}.small{font-size:15px}.bold{font-weight:bold}
    .unit{fill:#f2f6f6;stroke:#355362;stroke-width:2}
    .flow{fill:none;stroke:#355362;stroke-width:3;marker-end:url(#arrow)}
    .cold{stroke:#08649c}.hot{stroke:#ac480e}.return{stroke:#923549;stroke-dasharray:8 5}
    .limit{fill:none;stroke:#798c95;stroke-width:2;stroke-dasharray:8 6}
    .card{fill:#fff;stroke:#c8d5da;stroke-width:2}
    .tag{fill:#e8f0f1;stroke:#355362;stroke-width:1.5}
  </style>
  <rect width="920" height="756" fill="#fff"/>
  <rect class="card" x="12" y="12" width="896" height="314" rx="14"/>
  <text class="title" x="36" y="52">Balance de materia · línea HTST</text>
  <text id="balance-flow" x="36" y="82">Caso base a 5 000 L/h · estado estacionario</text>
  <path class="flow" d="M30 150H145"/>
  <rect class="unit" x="145" y="116" width="142" height="68" rx="4"/>
  <text class="bold" x="216" y="143" text-anchor="middle">Tanque</text>
  <text x="216" y="166" text-anchor="middle">y bomba</text>
  <path class="flow" d="M287 150H352"/>
  <rect class="unit" x="352" y="116" width="166" height="68" rx="4"/>
  <text class="bold" x="435" y="142" text-anchor="middle">Regenerador,</text>
  <text x="435" y="165" text-anchor="middle">calentador y retención</text>
  <path class="flow" d="M518 150H576"/>
  <rect class="unit" x="576" y="116" width="137" height="68" rx="4"/>
  <text class="bold" x="644" y="143" text-anchor="middle">Válvula</text>
  <text x="644" y="166" text-anchor="middle">de desvío</text>
  <path class="flow" id="balance-main-line" d="M713 150H752"/>
  <rect class="unit" x="752" y="116" width="122" height="68" rx="4"/>
  <text class="bold" x="813" y="141" text-anchor="middle">Regenerador</text>
  <text class="small" x="813" y="165" text-anchor="middle">y enfriador final</text>
  <path class="flow" id="balance-out-line" d="M813 184V225"/>
  <path class="flow return" id="balance-return-line" d="M644 184V236H216V184"/>
  <circle class="tag" cx="63" cy="150" r="15"/><text class="bold" x="63" y="156" text-anchor="middle">1</text>
  <circle class="tag" cx="813" cy="213" r="15"/><text class="bold" x="813" y="219" text-anchor="middle">2</text>
  <circle class="tag" cx="429" cy="236" r="15"/><text class="bold" x="429" y="242" text-anchor="middle">3</text>
  <text class="small" id="balance-inlet" x="35" y="122">Entrada · 4 °C</text>
  <text class="small" id="balance-outlet" x="738" y="250">Al almacén · 4 °C</text>
  <text class="small" x="429" y="219" text-anchor="middle">Retorno alternativo al tanque</text>
  <text class="bold" id="balance-mass" x="36" y="281">Producción normal: ṁ₁ = ṁ₂ = 5 150 kg/h (1,431 kg/s).</text>
  <text class="small" x="36" y="307">En desvío, la válvula envía su caudal a la corriente 3 y se interrumpe la salida 2.</text>

  <rect class="card" x="12" y="342" width="896" height="402" rx="14"/>
  <text class="title" x="36" y="385">Balance de energía · regenerador de placas</text>
  <text id="balance-energy-status" x="36" y="415">Caso base al 85 % · las corrientes circulan en contracorriente</text>
  <rect class="limit" x="249" y="451" width="420" height="165" rx="7"/>
  <text class="small" x="259" y="474">Límite de control</text>
  <rect class="unit" x="337" y="488" width="246" height="106" rx="5"/>
  <path class="flow cold" id="balance-cold-line" d="M76 513H819"/>
  <path class="flow hot" id="balance-hot-line" d="M846 568H76"/>
  <path class="flow" id="balance-heat-line" d="M460 562V523"/>
  <text class="small bold" x="470" y="548">Q recuperado</text>
  <text id="balance-cold-in" x="76" y="499">1 · Leche cruda · 4,0 °C</text>
  <text id="balance-cold-out" x="843" y="499" text-anchor="end">2 · Precalentada · 61,8 °C</text>
  <text id="balance-hot-in" x="843" y="595" text-anchor="end">3 · Pasteurizada · 72,0 °C</text>
  <text id="balance-hot-out" x="76" y="595">4 · Preenfriada · 14,2 °C</text>
  <text class="bold" id="balance-recovered" x="36" y="657">Calor cedido por la corriente caliente = calor ganado por la fría = 325,78 kW.</text>
  <text id="balance-utilities" x="36" y="684">Calentador: aporta 57,49 kW · enfriador final: retira 57,49 kW.</text>
  <text class="small" x="36" y="713">Modelo ideal sin pérdidas al ambiente. La energía cruza las placas; la leche permanece separada.</text>
</svg>
